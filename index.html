<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuestionario</title>
    <style>
        /* Estilo "hacker" sobrio mejorado */
        body {
            background-color: #0e0e0e;
            color: #c0c0c0;
            font-family: "Courier New", monospace;
            margin: 0;
            padding: 0;
            overflow: hidden; /* queremos controlar splash */
        }

        /* splash/login gif */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #splash img {
            max-width: 300px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .container {
            max-width: 800px;
            padding: 2rem;
            background-color: #1a1a1a;
            box-shadow: 0 0 20px #000;
            border: 1px solid #333;
            margin: auto;
            position: relative;
            top: 50px;
        }
        h1, h2 {
            color: #8aff8a;
            text-align: center;
            text-shadow: 0 0 5px #8aff8a;
        }
        .pregunta {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin: .25rem 0;
            cursor: pointer;
        }
        input[type="radio"] {
            margin-right: .5rem;
        }
        button {
            display: block;
            margin: 2rem auto 0;
            padding: .75rem 2rem;
            background: transparent;
            border: 1px solid #8aff8a;
            color: #8aff8a;
            font-size: 1rem;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }
        button:hover {
            background: rgba(138, 255, 138, .1);
            transform: scale(1.05);
        }
        #resultado {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div id="splash">
    <!-- reemplaza el src con la ruta de tu gif de login -->
    <img src="assets/login.gif" alt="Cargando ..." />
</div>
<div class="container">
    <h1>Cuestionario</h1>
    <form id="quiz">
        <!-- Se generan las preguntas con JavaScript -->
    </form>
    <button id="calcular">Calcular nota</button>
    <div id="resultado"></div>
</div>
<script>
    const preguntas = [
        {texto: "¿Qué significa emprender?", opciones: ["Copiar ideas de otros", "Iniciar un proyecto propio", "Evitar riesgos", "Trabajar solo"], correcta: 1},
        {texto: "¿Cuál de estas cualidades es importante en un emprendedor?", opciones: ["Creatividad", "Pereza", "Desinterés", "Conformismo"], correcta: 0},
        {texto: "¿Qué es el trabajo en equipo?", opciones: ["Hacer tareas sin ayuda", "Colaborar con otros para lograr un objetivo común", "Competir entre compañeros", "Ignorar las ideas de los demás"], correcta: 1},
        {texto: "¿Cuál es una ventaja de trabajar en equipo?", opciones: ["Más ideas y soluciones", "Menos comunicación", "Más conflictos", "Menos responsabilidad"], correcta: 0},
        {texto: "¿Qué significa “liderazgo” en un equipo?", opciones: ["Dar órdenes sin escuchar", "Guiar y motivar al grupo", "Trabajar solo", "Evitar responsabilidades"], correcta: 1},
        {texto: "¿Qué valor es esencial para el trabajo en equipo?", opciones: ["Respeto", "Egoísmo", "Desconfianza", "Desinterés"], correcta: 0},
        {texto: "¿Cuál de estas frases describe mejor la innovación?", opciones: ["Repetir lo mismo siempre", "Crear nuevas ideas o mejorar las existentes", "Evitar cambios", "Copiar sin modificar"], correcta: 1},
        {texto: "¿Qué es un plan de negocios?", opciones: ["Un documento que organiza ideas y estrategias de un proyecto", "Una lista de compras", "Un horario escolar", "Un contrato de trabajo"], correcta: 0},
        {texto: "¿Qué actitud ayuda más en un equipo?", opciones: ["Escuchar y aportar ideas", "Criticar sin proponer soluciones", "Ignorar las opiniones", "Trabajar sin comunicar"], correcta: 0},
        {texto: "¿Qué significa “empatía” en el trabajo en equipo?", opciones: ["Ponerse en el lugar del otro", "Ignorar sentimientos", "Competir siempre", "Pensar solo en uno mismo"], correcta: 0},
        {texto: "¿Cuál es un ejemplo de emprendimiento escolar?", opciones: ["Crear una feria de ciencias con proyectos propios", "Copiar tareas de otros", "Evitar participar en actividades", "No compartir ideas"], correcta: 0},
        {texto: "¿Qué recurso es más importante para un emprendedor?", opciones: ["La creatividad y la perseverancia", "La pereza", "La desorganización", "La falta de comunicación"], correcta: 0},
        {texto: "¿Qué significa “colaboración”?", opciones: ["Trabajar juntos para lograr un objetivo", "Evitar responsabilidades", "Criticar sin ayudar", "Trabajar en silencio"], correcta: 0},
        {texto: "¿Qué puede causar problemas en un equipo?", opciones: ["Falta de comunicación", "Respeto mutuo", "Escuchar ideas", "Organización"], correcta: 0},
        {texto: "¿Cuál es el primer paso para emprender un proyecto?", opciones: ["Identificar una idea o necesidad", "Evitar riesgos", "No planear nada", "Esperar que otros lo hagan"], correcta: 0},
    ];

    const form = document.getElementById('quiz');
    preguntas.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'pregunta';
        div.innerHTML = `<h2>${i + 1}. ${p.texto}</h2>`;
        p.opciones.forEach((opt, j) => {
            const id = `p${i}o${j}`;
            div.innerHTML += `
                <label for="${id}"><input type="radio" name="q${i}" id="${id}" value="${j}"> ${opt}</label>`;
        });
        form.appendChild(div);
    });

    document.getElementById('calcular').addEventListener('click', () => {
        let aciertos = 0;
        preguntas.forEach((p, i) => {
            const seleccion = form[`q${i}`].value;
            if (seleccion !== undefined && +seleccion === p.correcta) aciertos++;
        });
        // escala a 5 puntos
        const nota = ((aciertos / preguntas.length) * 5).toFixed(2);
        const pasa = nota >= 3.5;
        document.getElementById('resultado').textContent = `Aciertos: ${aciertos} de ${preguntas.length}. Nota: ${nota} / 5. ${pasa ? '¡Aprobado!' : 'Reprobado.'}`;
    });

    // splash hide after 5 segundos
    window.addEventListener('load', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash');
            splash.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }, 5000);
    });
</script>
</body>
</html>
